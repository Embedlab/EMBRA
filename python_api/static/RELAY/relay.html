<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay control</title>
    <link rel="stylesheet" href="../static/RELAY/relay_styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Relay Control</h1>
        <!-- Section for fetching relay status -->
        <div class="row">
            <div class="section">
                <h2>Relay Status</h2>
                <button id="status-btn" class="btn">Get Relay Status</button>
                <div id="status-response"></div>
            </div>
    
            <!-- Section for toggling relays -->
            <div class="section">
                <h2>Toggle Relays</h2>
                <div class="button-grid">
                    <button class="btn" data-channel="1">Toggle CH1</button>
                    <button class="btn" data-channel="2">Toggle CH2</button>
                    <button class="btn" data-channel="3">Toggle CH3</button>
                </div>
                <div id="toggle-response"></div>
            </div>
        </div>
    </div>
    <script src="../static/RELAY/relay.js"></script>
</body>
</html>
